<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTS Aqidah</title><style>body{font-family:Arial;margin:0;background:#f3f5f7}.wrap{max-width:850px;margin:auto;padding:15px}.card{background:white;padding:20px;margin:12px 0;border-radius:12px}input{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 12px;font-size:16px}button{padding:12px 18px;background:#155eef;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}.q{margin-bottom:15px}.opt{display:block;padding:10px;border:1px solid #ddd;border-radius:8px;margin:7px 0}.hidden{display:none}.score{font-size:55px;text-align:center;font-weight:bold}.wrong{background:#ffebee;padding:12px;margin:8px 0;border-radius:8px}</style></head><body><div class="wrap">
<div id="start" class="card"><h1>Ujian Tengah Semester — Aqidah</h1><p>20 soal pilihan ganda • 70 menit</p><label>Nama Siswa</label><input id="nama"><label>NIS/NISN</label><input id="nis"><label>Kelas</label><input id="kelas"><button id="mulai" type="button">Mulai Ujian</button></div>
<div id="exam" class="hidden"><div class="card"><b>Waktu: <span id="timer">70:00</span></b><div id="peserta"></div></div><div id="questions"></div><div class="card"><button id="selesai" type="button">Selesai Ujian</button></div></div>
<div id="hasil" class="card hidden"><h1>Hasil Ujian</h1><p id="identitas"></p><div id="nilai" class="score">0</div><p id="detail"></p><div id="salah"></div></div>
</div><script>
const Q=[{"n": 1, "q": "Secara bahasa lafadz يُّبِنَّال merupakan kata turunan dari kata بأَنَّال yang berarti?", "opts": {"A": "Kabar gembira", "B": "Peringatan", "C": "Berita", "D": "Petunjuk", "E": "Kebenaran"}, "answer": "C"}, {"n": 2, "q": "lafadz رَسُوْلٌ adalah turunan dari lafadz اِرْسَالٌ yang berarti?", "opts": {"A": "Petunjuk", "B": "Kebenaran", "C": "Hidayah", "D": "Pengutusan", "E": "Pemimpin"}, "answer": "D"}, {"n": 3, "q": "Manakah pengertian Rasul secara istilah dibawah ini yang benar?", "opts": {"A": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummatnya, baik dari kalangan orang-orang yang beriman, maupun dari orang-orang kafir.", "B": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang beriman.", "C": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang kafir.", "D": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada sekelompok kaum saja.", "E": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan dan untuk diamalkan."}, "answer": "A"}, {"n": 4, "q": "Manakah dibawah ini perbedaan antara Nabi dan Rasul?", "opts": {"A": "Seorang Nabi diutus ditengah kaum yang kufur – Seorang Rasul diutus ditengah kaum yang beriman.", "B": "Seorang Nabi sudah pasti Rasul – Seorang Rasul belum tentu seorang Nabi.", "C": "Jangkauan dakwah Rasul lebih sempit – Jangkauan dakwah Nabi lebih luas.", "D": "Pada umumnya, Nabi diutus dengan meneruskan syariat Rasul sebelumnya – Rasul diutus dengan syariat baru, namun juga adakalanya meneruskan syariat sebelumnya.", "E": "Seorang Nabi diturunkan padanya kitab suci – Seorang Rasul pada umunya hanya mengikuti pedoman kitab suci sebelumnya."}, "answer": "D"}, {"n": 5, "q": "Makna beriman kepada para Rasul adalah?", "opts": {"A": "Memberikan loyalitas penuh kepada para Rasul, mencintai, tidak membeda-bedakan di antara mereka, serta tidak membenci dan memusuhi mereka.", "B": "Mengimani bahwa setiap Rasul memiliki keutamaan.", "C": "Membenarkan dan meyakini bahwa Allah mengutus pada setiap ummat seorang Rasul dari mereka yang menyeru untuk beribadah kepada Allah saja dan mengingkari segala yang disembah selain Allah.", "D": "Meyakini bahwa Rasul adalah manusia biasa yang tidak memiliki sifat ketuhanan.", "E": "Semua jawaban diatas benar"}, "answer": "E"}, {"n": 6, "q": "“Kenabian adalah perkara yang atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut adalah keyakinan seorang yang bernama?, dan konsekuensi dari pernyataan tersebut adalah?", "opts": {"A": "Ibnu Qudamah", "B": "Ibnu Abdil Barr", "C": "Ibnu Majah", "D": "Ibnu Sina", "E": "Ibnu Mundzir"}, "answer": "D"}, {"n": 7, "q": "“Kenabian adalah perkara yang atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut memiliki konsekuensi?", "opts": {"A": "Dapat menyebabkan seseorang kufur", "B": "Boleh diyakini", "C": "Pernyataan tersebut mengandung kebenaran", "D": "Tidak mengapa diyakini karena tidak sepenuhnya salah", "E": "Tidak ada pilihan yang benar"}, "answer": "A"}, {"n": 8, "q": "Manakah dibawah ini yang merupakan keistimewaan para Nabi dan Rasul kecuali?", "opts": {"A": "Mereka maksum (terjaga) dari kesalahan dalam menyampaikan wahyu.", "B": "Mata para Nabi dan Rasul dapat tertidur, namun hatinya tetap terjaga.", "C": "Para Nabi dan Rasul dikuburkan di tempat mereka wafat.", "D": "Bumi tidak akan menghancurkan jasad mereka.", "E": "Para nabi dan Rasul diberikan umur yang Panjang."}, "answer": "E"}, {"n": 9, "q": "Manakah dibawah ini yang merupakan tugas-tugas Rasul?", "opts": {"A": "Menyampaikan Risalah Allah dengan jelas.", "B": "Menyeru untuk mengesakan Allah.", "C": "Memimpin umat.", "D": "Membawa kabar gembira dan peringatan.", "E": "Menyerahkan harta zakat."}, "answer": "E"}, {"n": 10, "q": "Manakah dibawah ini yang benar terkait hari dan tanggal kelahiran Nabi صلى الله عليه وسلم?", "opts": {"A": "Senin pagi, tanggal 3 rabi’ul awwal tahun gajah", "B": "Senin pagi, tanggal 22 rabi’ul awwal tahun gajah", "C": "Senin pagi, tanggal 9 rabi’ul awwal tahun gajah", "D": "Senin pagi, tanggal 21 rabi’ul awwal tahun gajah", "E": "Senin pagi, tanggal 4 rabi’ul awwal tahun gajah"}, "answer": "C"}, {"n": 11, "q": "Nabi diutus menjadi seorang Nabi/Rasul pada umur?", "opts": {"A": "40 tahun", "B": "41 tahun", "C": "42 tahun", "D": "43 tahun", "E": "44 tahun"}, "answer": "A"}, {"n": 12, "q": "Fase Nabi berdakwah di Kota Mekkah ….. tahun, dan Fase Nabi berdakwah di Kota Madinah ….. tahun, dan wafat di usia ….. tahun?", "opts": {"A": "10 – 13 – 63 tahun", "B": "13 – 10 – 63 tahun", "C": "10 – 13 – 60 tahun", "D": "13 – 10 – 60 tahun", "E": "13 – 10 – 65 tahun"}, "answer": "B"}, {"n": 13, "q": "Menurut Riwayat yang shahih, berapakah jumlah istri Nabi صلى الله عليه وسلم?", "opts": {"A": "9", "B": "10", "C": "11", "D": "12", "E": "13"}, "answer": "C"}, {"n": 14, "q": "Dibawah ini nama-nama istri Nabi صلى الله عليه وسلم kecuali?", "opts": {"A": "Ummu Habibah binti Abi Sufyan", "B": "Maimunah binti Al-Harits", "C": "Ummu Aiman bin Tsa’labah", "D": "Ummu Salamah binti Abi Umayyah", "E": "Zainab binti Khuzaimah"}, "answer": "C"}, {"n": 15, "q": "Diantara kewajiban beriman kepada Rasulullah صلى الله عليه وسلم kecuali?", "opts": {"A": "Beriman dan bersaksi bahwa beliau seorang Rasul dari sisi Allah.", "B": "Beriman bahwa beliau صلى الله عليه وسلم penutup para Nabi dan Rasul.", "C": "Beriman bahwa risalah Nabi صلى الله عليه وسلم menghapus risalah nabi-nabi terdahulu.", "D": "Meyakini bahwa beliau Nabi, namun tidak maksum terhadap apa yang beliau sampaikan.", "E": "Semua pilihan diatas benar."}, "answer": "D"}, {"n": 16, "q": "Diantara konsekuensi beriman kepada Rasulullah صلى الله عليه وسلم kecuali?", "opts": {"A": "Membenarkan semua berita yang beliau bawa.", "B": "Menaati segala sesuatu yang beliau perintahkan serta menjauhi segala yang beliau larang.", "C": "Menjalankan seluruh ibadah sesuai dengan syariat dan tuntunannya.", "D": "Mendakwahkan risalah yang beliau bawa kepada manusia.", "E": "Tidak ada pilihan yang benar"}, "answer": "D"}, {"n": 17, "q": "Ada Kaidah yang berlaku dalam syariat, terkait hukum asal ibadah dan perkara dunia, mana pernyataan yang benar terkait kaidah tersebut?", "opts": {"A": "Hukum asal perkara dunia adalah sunnah, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah mubah, sampai ada dalil yang melarang.", "B": "Hukum asal perkara dunia adalah haram, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah halal, sampai ada dalil yang melarang.", "C": "Hukum asal perkara dunia adalah makruh, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah sunnah, sampai ada dalil yang melarang.", "D": "Hukum asal perkara dunia adalah mubah, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan.", "E": "Hukum asal perkara dunia adalah halal, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan."}, "answer": "E"}, {"n": 18, "q": "Manakah diantara kekhususan Rasulullah صلى الله عليه وسلم di bawah ini?", "opts": {"A": "Pemimpin seluruh anak cucu Adam pada hari kiamat.", "B": "Pemilik Al-Wasilah", "C": "Orang pertama yang akan dibangkitkan di hari kiamat kelak.", "D": "Orang yang pertama kali mengetuk pintu surga.", "E": "Semua pilihan diatas benar"}, "answer": "E"}, {"n": 19, "q": "Ada syafa’at yang khusus hanya dimiliki oleh Nabi صلى الله عليه وسلم saja, syafa’at tersebut disebut dengan syafa’at “Al-‘Udzma” , syafa’at tersebut akan diberikan kepada?", "opts": {"A": "Kepada paman beliau Abu Thalib, agar siksaannya diringankan di dalam neraka.", "B": "Kepada Penghuni neraka yang masih memiliki keimanan meskipun sebesar dzarrah, untuk dikeluarkan dari neraka.", "C": "Kepada penghuni kubur, agar hari kebangkitan disegerakan.", "D": "Kepada Penghuni surga, agar ditambah kenikmatan bagi mereka.", "E": "Kepada Penduduk Masyhar, agar persidangan/hisab segera dimulai oleh Allah."}, "answer": "E"}, {"n": 20, "q": "Apa hukum membuat perkara-perkara yang baru dalam perkara ibadah/agama yang tidak pernah dicontohkan oleh Nabi صلى الله عليه وسلم?", "opts": {"A": "Tidak boleh, karena secara tidak langsung telah menuduh bahwa Nabi صلى الله عليه وسلم masih belum menyampaikan semua risalah dari Allah.", "B": "Boleh, asalkan tidak mengajak orang lain.", "C": "Boleh, asalkan hal tersebut baik.", "D": "Boleh, aslakan dengan niat yang ikhlash.", "E": "Boleh, namun dilakukan sesekali saja."}, "answer": "A"}];
const ENDPOINT='https://script.google.com/macros/s/AKfycbxUKsaJk3X-CMob1gRFaghREzSBJC-lNnHgR8yot3RmUDcFzdV-N-Z21vNlxl9T-CEp/exec';
let jawaban={},detik=4200,timerId=null,selesai=false;
const el=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tampilSoal(){el('questions').innerHTML=Q.map((x,i)=>'<div class="card q"><b>Soal '+x.n+'</b><p>'+escapeHtml(x.q)+'</p>'+Object.entries(x.opts).map(([k,v])=>'<label class="opt"><input type="radio" name="soal'+i+'" value="'+k+'"> '+k+'. '+escapeHtml(v)+'</label>').join('')+'</div>').join('');document.querySelectorAll('#questions input').forEach(r=>r.addEventListener('change',()=>{jawaban[Number(r.name.slice(4))]=r.value;}));}
function mulai(){const n=el('nama').value.trim(),k=el('kelas').value.trim();if(!n||!k){alert('Isi Nama dan Kelas terlebih dahulu.');return;}el('start').classList.add('hidden');el('exam').classList.remove('hidden');el('peserta').textContent=n+' • '+k;tampilSoal();timerId=setInterval(()=>{detik--;el('timer').textContent=Math.floor(detik/60).toString().padStart(2,'0')+':'+(detik%60).toString().padStart(2,'0');if(detik<=0)kirim(true);},1000);}
async function kirim(auto){if(selesai)return;if(!auto&&!confirm('Kirim jawaban dan lihat nilai?'))return;selesai=true;clearInterval(timerId);let benar=Q.reduce((n,x,i)=>n+(jawaban[i]===x.answer?1:0),0),nilai=Math.round(benar/20*100);el('exam').classList.add('hidden');el('hasil').classList.remove('hidden');el('identitas').textContent=el('nama').value+' • '+el('kelas').value;el('nilai').textContent=nilai;el('detail').textContent='Benar: '+benar+' dari 20 soal';const salah=Q.filter((x,i)=>jawaban[i]!==x.answer);el('salah').innerHTML=salah.length?'<h3>Jawaban yang salah / belum dijawab</h3>'+salah.map(x=>'<div class="wrong"><b>Soal '+x.n+'</b><br>'+escapeHtml(x.q)+'<br>Jawaban siswa: '+(jawaban[x.n-1]?jawaban[x.n-1]+'. '+escapeHtml(x.opts[jawaban[x.n-1]]):'Tidak dijawab')+'<br>Jawaban benar: '+x.answer+'. '+escapeHtml(x.opts[x.answer])+'</div>').join(''):'<h3>Semua jawaban benar.</h3>';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nama:el('nama').value.trim(),nis:el('nis').value.trim(),kelas:el('kelas').value.trim(),benar,salah:20-benar,nilai})});}catch(e){}}
el('mulai').addEventListener('click',mulai);el('selesai').addEventListener('click',()=>kirim(false));
</script></body></html>

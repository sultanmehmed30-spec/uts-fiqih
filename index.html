<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTS FIQIH</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #0001}h1{text-align:center;color:#174ea6}label{font-weight:700;display:block;margin:12px 0 6px}input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}.q{margin:20px 0}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #e0e5ed;border-radius:9px;cursor:pointer}.btn{border:0;border-radius:10px;padding:12px 18px;background:#174ea6;color:white;font-size:16px;cursor:pointer}.nav{display:flex;justify-content:space-between;gap:10px}.hidden{display:none}.result{text-align:center;font-size:24px;font-weight:700;color:#174ea6}.status{text-align:center;font-size:14px;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><h1>UJIAN TENGAH SEMESTER<br>FIQIH</h1><label>Nama Siswa</label><input id="nama" type="text" placeholder="Masukkan nama lengkap"><label>Kelas</label><input id="kelas" type="text" placeholder="Masukkan kelas"></div><div id="exam" class="card"></div><div class="card nav"><button class="btn" id="prev">← Sebelumnya</button><button class="btn" id="next">Berikutnya →</button></div><div class="card hidden" id="submitBox"><button class="btn" onclick="submitExam()" style="width:100%">KUMPULKAN JAWABAN</button></div><div id="result" class="card hidden"></div></div><script>
const SHEET_ENDPOINT='GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT';
const qs=[
['Manakah 2 jenis thaharah yang benar di bawah ini?',['Thaharah Maknawi dan Thaharah Syar’i','Thaharah Hissi dan Thaharah Syar’i','Thaharah Maknawi dan Thaharah Hissi','Thaharah Hissi dan Thaharah Nafsi','Thaharah Nafsi dan Thaharah Syar’i'],2],
['Secara Bahasa, Thaharah bermakna?',['Kebersihan dan Kesucian','Kebersihan dan Keindahan','Terlepas dari Najis','Suci, Indah dan putih','Kebersihan dan Kemurnian'],0],
['Secara istilah, Thaharah bermakna?',['Menghilangkan Kotoran yang ada pada tubuh','Membersihkan Kotoran menggunakan air','Mencuci Kotoran dengan Air dan Selain Air','Mengusap Kotoran dengan Tanah','Mengangkat Hadats dan Menghilangkan Kotoran'],4],
['Dalam Pembahasan BAB Air, ada berapa jenis air?',['Satu','Dua','Tiga','Empat','Lima'],3],
['Manakah dibawah ini Air yang tidak termasuk dalam pembahasan jenis-jenis Air?',['Thohirun Ghairu Muthohhir','Maa’un Najas','Thohirun Najas','Thohirun Muthohhir','Thohirun Muthohhir Makruh'],2],
['Manakah dibawah ini yang termasuk 3 sifat air?',['Bau, Aroma dan Warna','Warna, Rasa dan kejernihan','Bau, Rasa dan Warna','Aroma, banyak dan warna','Rasa, Bau dan Ukuran'],2],
['Apa hukum menggunakan bejana dari emas dan perak untuk makan dan minum?',['Makruh','Sunnah','Sunnah Muakkadah','Haram','Mubah'],3],
['Apa Hukum Asal Bejana orang Kafir?',['Halal','Haram','Mubah','Makruh','Tidak ada jawaban yang benar'],0],
['Hukum bersuci pada bejana dari kulit bangkai?',['Tidak boleh digunakan sama sekali','Boleh apabila telah disamak','Boleh apabila bangkai tersebut dari Binatang yang halal','Tidak ada jawaban yang benar','Pilihan B dan C benar'],4],
['Istinja adalah?',['Membersihkan kotoran menggunakan batu','Membersihkan kotoran menggunakan tisu','Membersihkan kotoran menggunakan daun','Pilihan A,B,C semuanya benar','Tidak ada jawaban yang benar'],3],
['Istijmar adalah?',['Membersihkan kotoran menggunakan sesuatu yang suci, mubah, dan bukan benda yang dimuliakan','Membersihkan kotoran menggunakan batu','Membersihkan kotoran menggunakan tisu','Membersihkan kotoran menggunakan daun','Semua pilihan diatas benar'],0],
['Hukum membuang hajat dengan posisi menghadap/membelakangi kiblat di tempat terbuka?',['Tidak boleh','Sunnah','Dianjurkan','Boleh asalkan tidak ada yang melihat','Tidak ada jawaban yang benar'],0],
['Diantara perkara yang disunnahkan ketika masuk WC kecuali?',['doa masuk WC','kaki kiri','tidak menyingkap aurat sebelum mendekat ke tanah','membaca Ta’awudz agar terhindar dari godaan syaitan di dalam WC','tidak berlama-lama'],3],
['Secara berurutan hukum: buang hajat pada air menggenang - menyentuh kemaluan tangan kanan ketika kencing - buang air kecil/besar di jalan/tempat berteduh/bawah pohon - membaca Al-Qur’an - istijmar dengan tisu basah.',['Haram – Tidak boleh – Haram – Haram – Boleh','Haram – Mubah – Haram – Haram – Boleh','Mubah – Haram – Haram – Haram – Boleh','Makruh – Haram – Haram – Haram – Boleh','Haram – Boleh – Haram – Haram – Boleh'],0],
['Perkara makruh dilakukan saat buang hajat?',['Buang hajat menghadap arah bertiupnya angin – Membaca Al-Qur’an','Buang hajat sambil berbicara – ber istinja dengan tangan kanan','Buang air kecil pada lubang dan semisalnya – Masuk WC dengan membawa sesuatu yang terdapat padanya dzikrullah','Buang hajat sambil berbicara – Membawa mushaf masuk WC','Tidak ada jawaban yang benar'],2],
['Dalam Hadits Muadz, 3 perbuatan yang menyebabkan pelakunya dilaknat?',['Buang air kecil di WC, buang air sambil berdiri dan buang air di sumber air','Buang air kecil dan besar di tanah lapang, di sumber air dan di tempat berteduh','Buang air di sumber air, di Tengah jalan dan di tempat berteduh','Buang air di tanah lapang, buang air di tempat berteduh dan di alam terbuka','Tidak ada pilihan yang benar'],2],
['Ilmu Fiqih adalah ilmu yang mempelajari tentang?',['Keimanan kepada Allah','Memahami konsep ibadah','Mendalami perkara tauhid','Mempelajari hal-hal yang berkaitan dengan hukum-hukum syariat yang bersifat amaliah (amalan)','Mempelajari tentang ilmu jual beli'],3],
['Hukum mempelajari ilmu fiqih bagi seorang muslim?',['Fardhu ‘ain','Sunnah','Mubah','Tidak ada paksaan','Makruh'],0],
['Sejauh ini, dalam mata Pelajaran “Fiqih”, apakah kamu memperoleh manfaat ...?',['Belum','Mendapatkan sedikit manfaat','Memberikan pengaruh pada amalan sehari-hari','Tidak terlalu memberikan efek setelah mempelajarinya','Belum memahami Pelajaran Fiqih sama sekali'],2],
['Hukum mencontek, kerjasama, berdiskusi, bertanya jawaban kepada teman saat ujian?',['Haram','Makruh','Sunnah','Mubah','Boleh asalkan pengawas tidak tahu'],0]
];
let i=0,ans=Array(qs.length).fill(null);
function render(){let q=qs[i];document.getElementById('exam').innerHTML='<div class="q"><h2>Soal '+(i+1)+' dari '+qs.length+'</h2><p><b>'+q[0]+'</b></p>'+q[1].map((o,j)=>`<label class="opt"><input type="radio" name="a" value="${j}" ${ans[i]===j?'checked':''} onchange="ans[i]=+this.value"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')+'</div>';document.getElementById('prev').disabled=i===0;document.getElementById('next').classList.toggle('hidden',i===qs.length-1);document.getElementById('submitBox').classList.toggle('hidden',i!==qs.length-1)}
async function submitExam(){const nama=document.getElementById('nama').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!nama||!kelas){alert('Silakan isi nama dan kelas terlebih dahulu.');return}if(ans.includes(null)){alert('Masih ada soal yang belum dijawab.');return}let benar=ans.reduce((n,a,k)=>n+(a===qs[k][2]?1:0),0),nilai=benar/qs.length*100;document.getElementById('exam').classList.add('hidden');document.querySelector('.nav').classList.add('hidden');document.getElementById('submitBox').classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<div class="result">Ujian Selesai!<br>Nama: '+escapeHtml(nama)+'<br>Kelas: '+escapeHtml(kelas)+'<br><br>Nilai: '+nilai+'<div class="status" id="status">Menyimpan hasil...</div></div>';try{if(SHEET_ENDPOINT.indexOf('GANTI_')!==0){await fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nama,kelas,benar,salah:qs.length-benar,nilai})});document.getElementById('status').textContent='Hasil ujian telah tersimpan.'}else document.getElementById('status').textContent='Nilai tampil, tetapi penyimpanan belum dihubungkan.'}catch(e){document.getElementById('status').textContent='Nilai tampil. Penyimpanan gagal, silakan hubungi guru.'}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<qs.length-1){i++;render()}};render();
</script></body></html>

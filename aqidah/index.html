<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTS AQIDAH</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #0001}h1{text-align:center;color:#174ea6}label{font-weight:700;display:block;margin:12px 0 6px}input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}.q{margin:20px 0}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #e0e5ed;border-radius:9px;cursor:pointer;font-weight:400}.btn{border:0;border-radius:10px;padding:12px 18px;background:#174ea6;color:white;font-size:16px;cursor:pointer}.nav{display:flex;justify-content:space-between;gap:10px}.hidden{display:none}.result{text-align:center;font-size:22px;font-weight:700;color:#174ea6}.status{text-align:center;font-size:14px;margin-top:12px;color:#555}.review{margin-top:22px;text-align:left;font-size:17px;color:#172033}.review p{padding:12px;border-radius:10px;margin:8px 0}.correct{background:#e8f5e9;border-left:5px solid #2e7d32}.wrong{background:#ffebee;border-left:5px solid #c62828}.note{background:#fff8e1;border-left:5px solid #f9a825;padding:12px;text-align:left;font-size:14px}</style></head><body><div class="wrap"><div class="card"><h1>UJIAN TENGAH SEMESTER<br>AQIDAH</h1><label>Nama Siswa</label><input id="nama" type="text" placeholder="Masukkan nama lengkap"><label>Kelas</label><input id="kelas" type="text" placeholder="Masukkan kelas"></div><div id="exam" class="card"></div><div class="card nav"><button class="btn" id="prev">← Sebelumnya</button><button class="btn" id="next">Berikutnya →</button></div><div class="card hidden" id="submitBox"><button class="btn" onclick="submitExam()" style="width:100%">KUMPULKAN JAWABAN</button></div><div id="result" class="card hidden"></div></div><script>
const SHEET_ENDPOINT='https://script.google.com/macros/s/AKfycbySVnNfceLVEVZe78eWElBJ7Nzcudu1C40mWumzxbtr8480qfhqpZ-4mwyThS0-hNIE/exec';
const qs=[
['Secara bahasa lafadz يُّبِنَّال merupakan kata turunan dari kata بأَنَّال yang berarti?',['Kabar gembira','Peringatan','Berita','Petunjuk','Kebenaran'],2],
['Lafadz رَسُوْلٌ adalah turunan dari lafadz اِرْسَالٌ yang berarti?',['Petunjuk','Kebenaran','Hidayah','Pengutusan','Pemimpin'],3],
['Manakah pengertian Rasul secara istilah dibawah ini yang benar?',['Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummatnya, baik dari kalangan orang-orang yang beriman, maupun dari kalangan orang-orang kafir.','Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang beriman.','Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang kafir.','Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada sekelompok kaum saja.','Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan dan untuk diamalkan.'],0],
['Manakah dibawah ini perbedaan antara Nabi dan Rasul?',['Seorang Nabi diutus ditengah kaum yang kufur – Seorang Rasul diutus ditengah kaum yang beriman.','Seorang Nabi sudah pasti Rasul – Seorang Rasul belum tentu seorang Nabi.','Jangkauan dakwah Rasul lebih sempit – Jangkauan dakwah Nabi lebih luas.','Pada umumnya, Nabi diutus dengan meneruskan syariat Rasul sebelumnya – Rasul diutus dengan syariat baru, namun juga adakalanya meneruskan syariat sebelumnya.','Seorang Nabi diturunkan padanya kitab suci – Seorang Rasul pada umunya hanya mengikuti pedoman kitab suci sebelumnya.'],3],
['Makna beriman kepada para Rasul adalah?',['Memberikan loyalitas penuh kepada para Rasul, mencintai, tidak membeda-bedakan di antara mereka, serta tidak membenci dan memusuhi mereka.','Mengimani bahwa setiap Rasul memiliki keutamaan.','Membenarkan dan meyakini bahwa Allah mengutus pada setiap ummat seorang Rasul dari mereka yang menyeru untuk beribadah kepada Allah saja dan mengingkari segala yang disembah selain Allah.','Meyakini bahwa Rasul adalah manusia biasa yang tidak memiliki sifat ketuhanan.','Semua jawaban diatas benar'],4],
['“Kenabian adalah perkara atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut adalah keyakinan seorang yang bernama?, dan konsekuensi dari pernyataan tersebut adalah?',['Ibnu Qudamah','Ibnu Abdil Barr','Ibnu Majah','Ibnu Sina','Ibnu Mundzir'],3],
['“Kenabian adalah perkara atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut memiliki konsekuensi?',['Dapat menyebabkan seseorang kufur','Boleh diyakini','Pernyataan tersebut mengandung kebenaran','Tidak mengapa diyakini karena tidak sepenuhnya salah','Tidak ada pilihan yang benar'],0],
['Manakah dibawah ini yang merupakan keistimewaan para Nabi dan Rasul kecuali?',['Mereka maksum (terjaga) dari kesalahan dalam menyampaikan wahyu.','Mata para Nabi dan Rasul dapat tertidur, namun hatinya tetap terjaga.','Para Nabi dan Rasul dikuburkan di tempat mereka wafat.','Bumi tidak akan menghancurkan jasad mereka.','Para nabi dan Rasul diberikan umur yang Panjang.'],4],
['Manakah dibawah ini yang merupakan tugas-tugas Rasul?',['Menyampaikan Risalah Allah dengan jelas.','Menyeru untuk mengesakan Allah.','Memimpin umat.','Membawa kabar gembira dan peringatan.','Menyerahkan harta zakat.'],4],
['Manakah dibawah ini yang benar terkait hari dan tanggal kelahiran Nabi صلى الله عليه وسلم?',['Senin pagi, tanggal 3 rabi’ul awwal tahun gajah','Senin pagi, tanggal 22 rabi’ul awwal tahun gajah','Senin pagi, tanggal 9 rabi’ul awwal tahun gajah','Senin pagi, tanggal 21 rabi’ul awwal tahun gajah','Senin pagi, tanggal 4 rabi’ul awwal tahun gajah'],2],
['Nabi diutus menjadi seorang Nabi/Rasul pada umur?',['40 tahun','41 tahun','42 tahun','43 tahun','44 tahun'],0],
['Fase Nabi berdakwah di Kota Mekkah ….. tahun, dan Fase Nabi berdakwah di Kota Madinah ….. tahun, dan wafat di usia ….. tahun?',['10 – 13 – 63 tahun','13 – 10 – 63 tahun','10 – 13 – 60 tahun','13 – 10 – 60 tahun','13 – 10 – 65 tahun'],1],
['Menurut Riwayat yang shahih, berapakah jumlah istri Nabi صلى الله عليه وسلم?',['9','10','11','12','13'],2],
['Dibawah ini nama-nama istri Nabi صلى الله عليه وسلم kecuali?',['Ummu Habibah binti Abi Sufyan','Maimunah binti Al-Harits','Ummu Aiman bin Tsa’labah','Ummu Salamah binti Abi Umayyah','Zainab binti Khuzaimah'],2],
['Diantara kewajiban beriman kepada Rasulullah صلى الله عليه وسلم kecuali?',['Beriman dan bersaksi bahwa beliau seorang Rasul dari sisi Allah.','Beriman bahwa beliau صلى الله عليه وسلم penutup para Nabi dan Rasul.','Beriman bahwa risalah Nabi صلى الله عليه وسلم menghapus risalah nabi-nabi terdahulu.','Meyakini bahwa beliau Nabi, namun tidak maksum terhadap apa yang beliau sampaikan.','Semua pilihan diatas benar.'],3],
['Diantara konsekuensi beriman kepada Rasulullah صلى الله عليه وسلم kecuali?',['Membenarkan semua berita yang beliau bawa.','Menaati segala sesuatu yang beliau perintahkan serta menjauhi segala yang beliau larang.','Menjalankan seluruh ibadah sesuai dengan syariat dan tuntunannya.','Mendakwahkan risalah yang beliau bawa kepada manusia.','Tidak ada pilihan yang benar'],3],
['Ada Kaidah yang berlaku dalam syariat, terkait hukum asal ibadah dan perkara dunia, mana pernyataan yang benar terkait kaidah tersebut?',['Hukum asal perkara dunia adalah sunnah, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah mubah, sampai ada dalil yang melarang.','Hukum asal perkara dunia adalah haram, sampai ada dalil yang memrintahkan. Sedangkan Hukum asal ibadah adalah halal, sampai ada dalil yang melarang.','Hukum asal perkara dunia adalah makruh, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah sunnah, sampai ada dalil yang melarang.','Hukum asal perkara dunia adalah mubah, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan.','Hukum asal perkara dunia adalah halal, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan.'],4],
['Manakah diantara kekhususan Rasulullah صلى الله عليه وسلم di bawah ini?',['Pemimpin seluruh anak cucu Adam pada hari kiamat.','Pemilik Al-Wasilah','Orang pertama yang akan dibangkitkan di hari kiamat kelak.','Orang yang pertama kali mengetuk pintu surga.','Semua pilihan diatas benar'],4],
['Ada syafa’at yang khusus hanya dimiliki oleh Nabi صلى الله عليه وسلم saja, syafa’at tersebut disebut dengan syafa’at “Al-‘Udzma”, syafa’at tersebut akan diberikan kepada?',['Kepada paman beliau Abu Thalib, agar siksaannya diringankan di dalam neraka.','Kepada Penghuni neraka yang masih memiliki keimanan meskipun sebesar dzarrah, untuk dikeluarkan dari neraka.','Kepada penghuni kubur, agar hari kebangkitan disegerakan.','Kepada Penghuni surga, agar ditambah kenikmatan bagi mereka.','Kepada Penduduk Masyhar, agar persidangan/hisab segera dimulai oleh Allah.'],4],
['Apa hukum membuat perkara-perkara yang baru dalam perkara ibadah/agama yang tidak pernah dicontohkan oleh Nabi صلى الله عليه وسلم?',['Tidak boleh, karena secara tidak langsung telah menuduh bahwa Nabi صلى الله عليه وسلم masih belum menyampaikan semua risalah dari Allah.','Boleh, asalkan tidak mengajak orang lain.','Boleh, asalkan hal tersebut baik.','Boleh, aslakan dengan niat yang ikhlash.','Boleh, namun dilakukan sesekali saja.'],null]
];
let i=0,ans=Array(qs.length).fill(null);
function render(){let q=qs[i];document.getElementById('exam').innerHTML='<div class="q"><h2>Soal '+(i+1)+' dari '+qs.length+'</h2><p><b>'+q[0]+'</b></p>'+q[1].map((o,j)=>`<label class="opt"><input type="radio" name="a" value="${j}" ${ans[i]===j?'checked':''} onchange="ans[i]=+this.value"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')+(q[2]===null?'<div class="note"><b>Catatan:</b> Kunci jawaban nomor 20 tidak tercantum dalam file soal, sehingga soal ini belum masuk perhitungan nilai.</div>':'')+'</div>';document.getElementById('prev').disabled=i===0;document.getElementById('next').classList.toggle('hidden',i===qs.length-1);document.getElementById('submitBox').classList.toggle('hidden',i!==qs.length-1)}
async function submitExam(){const nama=document.getElementById('nama').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!nama||!kelas){alert('Silakan isi nama dan kelas terlebih dahulu.');return}if(ans.includes(null)){alert('Masih ada soal yang belum dijawab.');return}const scored=qs.map((q,k)=>q[2]!==null?k:null).filter(k=>k!==null);let benar=0,nomorBenar=[],nomorSalah=[];scored.forEach(k=>{if(ans[k]===qs[k][2]){benar++;nomorBenar.push(k+1)}else nomorSalah.push(k+1)});let nilai=benar/scored.length*100;document.getElementById('exam').classList.add('hidden');document.querySelector('.nav').classList.add('hidden');document.getElementById('submitBox').classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<div class="result">Ujian Selesai!<br>Nama: '+escapeHtml(nama)+'<br>Kelas: '+escapeHtml(kelas)+'<div style="font-size:30px;margin:15px">Nilai: '+nilai.toFixed(0)+'</div><div class="review"><p class="correct"><b>✓ Jawaban Benar ('+nomorBenar.length+' soal)</b><br>Nomor: '+nomorBenar.join(', ')+'</p><p class="wrong"><b>✗ Jawaban Salah ('+nomorSalah.length+' soal)</b><br>Nomor: '+nomorSalah.join(', ')+'</p><div class="note">Nilai dihitung dari 19 soal karena kunci nomor 20 belum tercantum pada file sumber.</div></div><div class="status" id="status">Menyimpan hasil...</div></div>';try{await fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nama,kelas,benar,salah:scored.length-benar,nilai,mapel:'AQIDAH'})});document.getElementById('status').textContent='Hasil ujian telah tersimpan.'}catch(e){document.getElementById('status').textContent='Nilai tampil. Penyimpanan gagal, silakan hubungi guru.'}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<qs.length-1){i++;render()}};render();
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTS Aqidah</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;padding:22px;border-radius:15px;margin:14px 0;box-shadow:0 3px 15px #0001}h1{margin:0 0 8px}.muted{color:#667085}label.field{display:block;font-weight:bold;margin:13px 0 6px}input[type=text]{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{padding:12px 18px;border:0;border-radius:8px;font-weight:bold;background:#155eef;color:#fff;cursor:pointer;font-size:16px}.option{display:block;border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:9px;cursor:pointer;font-weight:normal}.option input{margin-right:8px}.top{display:flex;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:3}.timer{font-weight:bold;font-size:20px}.hidden{display:none}.score{font-size:60px;font-weight:bold;text-align:center}.result{text-align:center}.barbg{height:8px;background:#ddd;border-radius:9px;overflow:hidden}.bar{height:100%;background:#155eef;width:0}.warn{background:#fff8e1;padding:12px;border-radius:8px}@media(max-width:600px){.wrap{padding:10px}.card{padding:16px}.top{flex-direction:column}}
</style></head><body><div class="wrap">
<div id="start" class="card"><h1>Ujian Tengah Semester — Aqidah</h1><p class="muted">20 soal pilihan ganda • waktu 70 menit • nilai otomatis</p>
<label class="field">Nama Siswa</label><input id="name" type="text" placeholder="Nama lengkap">
<label class="field">NIS/NISN (opsional)</label><input id="nis" type="text" placeholder="NIS/NISN">
<label class="field">Kelas</label><input id="kelas" type="text" placeholder="X / XI">
<p class="warn">Kerjakan secara mandiri. Nilai langsung muncul setelah ujian dikirim.</p><br><button onclick="startExam()">Mulai Ujian</button></div>
<div id="exam" class="hidden"><div class="card top"><div><b>UTS Aqidah</b><div id="who" class="muted"></div></div><div id="timer" class="timer">70:00</div></div>
<div class="card"><span id="prog">0/20 terjawab</span><div class="barbg"><div id="bar" class="bar"></div></div></div><div id="qs"></div>
<div class="card"><button onclick="submitExam(false)">Selesai Ujian</button></div></div>
<div id="result" class="card result hidden">
<h1>Hasil Ujian</h1><p id="rwho" class="muted"></p><div id="score" class="score">0</div>
<p id="detail"></p><div id="wrongList" style="text-align:left;margin-top:20px"></div>
<button onclick="window.print()">Cetak / Simpan Hasil</button></div>
</div><script>
const Q=[{"n": 1, "q": "Secara bahasa lafadz يُّبِنَّال merupakan kata turunan dari kata بأَنَّال yang berarti?", "opts": {"A": "Kabar gembira", "B": "Peringatan", "C": "Berita", "D": "Petunjuk", "E": "Kebenaran"}, "answer": "C"}, {"n": 2, "q": "lafadz رَسُوْلٌ adalah turunan dari lafadz اِرْسَالٌ yang berarti?", "opts": {"A": "Petunjuk", "B": "Kebenaran", "C": "Hidayah", "D": "Pengutusan", "E": "Pemimpin"}, "answer": "D"}, {"n": 3, "q": "Manakah pengertian Rasul secara istilah dibawah ini yang benar?", "opts": {"A": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummatnya, baik dari kalangan orang-orang yang beriman, maupun dari orang-orang kafir.", "B": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang beriman.", "C": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada ummat yang kafir.", "D": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan kepada sekelompok kaum saja.", "E": "Seseorang yang diutus oleh Allah untuk membawa syariat untuk disampaikan dan untuk diamalkan."}, "answer": "A"}, {"n": 4, "q": "Manakah dibawah ini perbedaan antara Nabi dan Rasul?", "opts": {"A": "Seorang Nabi diutus ditengah kaum yang kufur – Seorang Rasul diutus ditengah kaum yang beriman.", "B": "Seorang Nabi sudah pasti Rasul – Seorang Rasul belum tentu seorang Nabi.", "C": "Jangkauan dakwah Rasul lebih sempit – Jangkauan dakwah Nabi lebih luas.", "D": "Pada umumnya, Nabi diutus dengan meneruskan syariat Rasul sebelumnya – Rasul diutus dengan syariat baru, namun juga adakalanya meneruskan syariat sebelumnya.", "E": "Seorang Nabi diturunkan padanya kitab suci – Seorang Rasul pada umunya hanya mengikuti pedoman kitab suci sebelumnya."}, "answer": "D"}, {"n": 5, "q": "Makna beriman kepada para Rasul adalah?", "opts": {"A": "Memberikan loyalitas penuh kepada para Rasul, mencintai, tidak membeda-bedakan di antara mereka, serta tidak membenci dan memusuhi mereka.", "B": "Mengimani bahwa setiap Rasul memiliki keutamaan.", "C": "Membenarkan dan meyakini bahwa Allah mengutus pada setiap ummat seorang Rasul dari mereka yang menyeru untuk beribadah kepada Allah saja dan mengingkari segala yang disembah selain Allah.", "D": "Meyakini bahwa Rasul adalah manusia biasa yang tidak memiliki sifat ketuhanan.", "E": "Semua jawaban diatas benar"}, "answer": "E"}, {"n": 6, "q": "“Kenabian adalah perkara yang atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut adalah keyakinan seorang yang bernama?, dan konsekuensi dari pernyataan tersebut adalah?", "opts": {"A": "Ibnu Qudamah", "B": "Ibnu Abdil Barr", "C": "Ibnu Majah", "D": "Ibnu Sina", "E": "Ibnu Mundzir"}, "answer": "D"}, {"n": 7, "q": "“Kenabian adalah perkara yang atau kedudukan yang bisa diraih dengan usaha dan cara tertentu”, pernyataan tersebut memiliki konsekuensi?", "opts": {"A": "Dapat menyebabkan seseorang kufur", "B": "Boleh diyakini", "C": "Pernyataan tersebut mengandung kebenaran", "D": "Tidak mengapa diyakini karena tidak sepenuhnya salah", "E": "Tidak ada pilihan yang benar"}, "answer": "A"}, {"n": 8, "q": "Manakah dibawah ini yang merupakan keistimewaan para Nabi dan Rasul kecuali?", "opts": {"A": "Mereka maksum (terjaga) dari kesalahan dalam menyampaikan wahyu.", "B": "Mata para Nabi dan Rasul dapat tertidur, namun hatinya tetap terjaga.", "C": "Para Nabi dan Rasul dikuburkan di tempat mereka wafat.", "D": "Bumi tidak akan menghancurkan jasad mereka.", "E": "Para nabi dan Rasul diberikan umur yang Panjang."}, "answer": "E"}, {"n": 9, "q": "Manakah dibawah ini yang merupakan tugas-tugas Rasul?", "opts": {"A": "Menyampaikan Risalah Allah dengan jelas.", "B": "Menyeru untuk mengesakan Allah.", "C": "Memimpin umat.", "D": "Membawa kabar gembira dan peringatan.", "E": "Menyerahkan harta zakat."}, "answer": "E"}, {"n": 10, "q": "Manakah dibawah ini yang benar terkait hari dan tanggal kelahiran Nabi صلى الله عليه وسلم?", "opts": {"A": "Senin pagi, tanggal 3 rabi’ul awwal tahun gajah", "B": "Senin pagi, tanggal 22 rabi’ul awwal tahun gajah", "C": "Senin pagi, tanggal 9 rabi’ul awwal tahun gajah", "D": "Senin pagi, tanggal 21 rabi’ul awwal tahun gajah", "E": "Senin pagi, tanggal 4 rabi’ul awwal tahun gajah"}, "answer": "C"}, {"n": 11, "q": "Nabi diutus menjadi seorang Nabi/Rasul pada umur?", "opts": {"A": "40 tahun", "B": "41 tahun", "C": "42 tahun", "D": "43 tahun", "E": "44 tahun"}, "answer": "A"}, {"n": 12, "q": "Fase Nabi berdakwah di Kota Mekkah ….. tahun, dan Fase Nabi berdakwah di Kota Madinah ….. tahun, dan wafat di usia ….. tahun?", "opts": {"A": "10 – 13 – 63 tahun", "B": "13 – 10 – 63 tahun", "C": "10 – 13 – 60 tahun", "D": "13 – 10 – 60 tahun", "E": "13 – 10 – 65 tahun"}, "answer": "B"}, {"n": 13, "q": "Menurut Riwayat yang shahih, berapakah jumlah istri Nabi صلى الله عليه وسلم?", "opts": {"A": "9", "B": "10", "C": "11", "D": "12", "E": "13"}, "answer": "C"}, {"n": 14, "q": "Dibawah ini nama-nama istri Nabi صلى الله عليه وسلم kecuali?", "opts": {"A": "Ummu Habibah binti Abi Sufyan", "B": "Maimunah binti Al-Harits", "C": "Ummu Aiman bin Tsa’labah", "D": "Ummu Salamah binti Abi Umayyah", "E": "Zainab binti Khuzaimah"}, "answer": "C"}, {"n": 15, "q": "Diantara kewajiban beriman kepada Rasulullah صلى الله عليه وسلم kecuali?", "opts": {"A": "Beriman dan bersaksi bahwa beliau seorang Rasul dari sisi Allah.", "B": "Beriman bahwa beliau صلى الله عليه وسلم penutup para Nabi dan Rasul.", "C": "Beriman bahwa risalah Nabi صلى الله عليه وسلم menghapus risalah nabi-nabi terdahulu.", "D": "Meyakini bahwa beliau Nabi, namun tidak maksum terhadap apa yang beliau sampaikan.", "E": "Semua pilihan diatas benar."}, "answer": "D"}, {"n": 16, "q": "Diantara konsekuensi beriman kepada Rasulullah صلى الله عليه وسلم kecuali?", "opts": {"A": "Membenarkan semua berita yang beliau bawa.", "B": "Menaati segala sesuatu yang beliau perintahkan serta menjauhi segala yang beliau larang.", "C": "Menjalankan seluruh ibadah sesuai dengan syariat dan tuntunannya.", "D": "Mendakwahkan risalah yang beliau bawa kepada manusia.", "E": "Tidak ada pilihan yang benar"}, "answer": "D"}, {"n": 17, "q": "Ada Kaidah yang berlaku dalam syariat, terkait hukum asal ibadah dan perkara dunia, mana pernyataan yang benar terkait kaidah tersebut?", "opts": {"A": "Hukum asal perkara dunia adalah sunnah, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah mubah, sampai ada dalil yang melarang.", "B": "Hukum asal perkara dunia adalah haram, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah halal, sampai ada dalil yang melarang.", "C": "Hukum asal perkara dunia adalah makruh, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah sunnah, sampai ada dalil yang melarang.", "D": "Hukum asal perkara dunia adalah mubah, sampai ada dalil yang memerintahkan. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan.", "E": "Hukum asal perkara dunia adalah halal, sampai ada dalil yang melarang. Sedangkan Hukum asal ibadah adalah haram, sampai ada dalil yang memerintahkan."}, "answer": "E"}, {"n": 18, "q": "Manakah diantara kekhususan Rasulullah صلى الله عليه وسلم di bawah ini?", "opts": {"A": "Pemimpin seluruh anak cucu Adam pada hari kiamat.", "B": "Pemilik Al-Wasilah", "C": "Orang pertama yang akan dibangkitkan di hari kiamat kelak.", "D": "Orang yang pertama kali mengetuk pintu surga.", "E": "Semua pilihan diatas benar"}, "answer": "E"}, {"n": 19, "q": "Ada syafa’at yang khusus hanya dimiliki oleh Nabi صلى الله عليه وسلم saja, syafa’at tersebut disebut dengan syafa’at “Al-‘Udzma” , syafa’at tersebut akan diberikan kepada?", "opts": {"A": "Kepada paman beliau Abu Thalib, agar siksaannya diringankan di dalam neraka.", "B": "Kepada Penghuni neraka yang masih memiliki keimanan meskipun sebesar dzarrah, untuk dikeluarkan dari neraka.", "C": "Kepada penghuni kubur, agar hari kebangkitan disegerakan.", "D": "Kepada Penghuni surga, agar ditambah kenikmatan bagi mereka.", "E": "Kepada Penduduk Masyhar, agar persidangan/hisab segera dimulai oleh Allah."}, "answer": "E"}, {"n": 20, "q": "Apa hukum membuat perkara-perkara yang baru dalam perkara ibadah/agama yang tidak pernah dicontohkan oleh Nabi صلى الله عليه وسلم?", "opts": {"A": "Tidak boleh, karena secara tidak langsung telah menuduh bahwa Nabi صلى الله عليه وسلم masih belum menyampaikan semua risalah dari Allah.", "B": "Boleh, asalkan tidak mengajak orang lain.", "C": "Boleh, asalkan hal tersebut baik.", "D": "Boleh, aslakan dengan niat yang ikhlash.", "E": "Boleh, namun dilakukan sesekali saja."}, "answer": "A"}];const SHEET_ENDPOINT='https://script.google.com/macros/s/AKfycbxUKsaJk3X-CMob1gRFaghREzSBJC-lNnHgR8yot3RmUDcFzdV-N-Z21vNlxl9T-CEp/exec';
let A={},left=4200,ended=false,handle;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startExam(){const n=name.value.trim(),k=kelas.value.trim();if(!n||!k){alert("Isi Nama dan Kelas terlebih dahulu.");return}document.getElementById("start").classList.add("hidden");document.getElementById("exam").classList.remove("hidden");who.textContent=n+" • "+k;render();handle=setInterval(tick,1000);window.scrollTo(0,0);}
function render(){qs.innerHTML=Q.map((x,i)=>'<div class="card"><b>Soal '+x.n+'</b><h3>'+esc(x.q)+'</h3>'+Object.entries(x.opts).map(([k,v])=>'<label class="option"><input type="radio" name="q'+i+'" value="'+k+'" onchange="A['+i+']=this.value;progress()"> <b>'+k+'.</b> '+esc(v)+'</label>').join('')+'</div>').join('');progress();}
function progress(){let n=Object.keys(A).length;prog.textContent=n+"/20 terjawab";bar.style.width=(n/20*100)+"%";}
function tick(){if(ended)return;left--;let m=Math.floor(left/60),s=left%60;timer.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(left<=0)submitExam(true);}
async function submitExam(auto){if(ended)return;let u=20-Object.keys(A).length;if(!auto&&!confirm(u?"Masih ada "+u+" soal belum dijawab. Kirim sekarang?":"Kirim jawaban dan lihat nilai?"))return;ended=true;clearInterval(handle);let c=Q.reduce((n,x,i)=>n+(A[i]===x.answer?1:0),0),nilai=Math.round(c/20*100);document.getElementById("exam").classList.add("hidden");document.getElementById("result").classList.remove("hidden");rwho.textContent="Peserta: "+name.value.trim()+" • "+kelas.value.trim();score.textContent=nilai;detail.textContent="Benar: "+c+" dari 20 soal"+(auto?" • waktu habis":"");let wrong=Q.filter((x,i)=>A[i]!==x.answer);wrongList.innerHTML=wrong.length?'<h3>Rincian Jawaban yang Salah</h3>'+wrong.map(x=>'<p style="padding:12px;border-radius:10px;background:#ffebee;border-left:5px solid #c62828"><b>Soal '+x.n+'</b><br>'+esc(x.q)+'<br><b>Jawaban siswa:</b> '+(A[x.n-1]?esc(A[x.n-1])+'. '+esc(x.opts[A[x.n-1]]):'Tidak dijawab')+'<br><b>Jawaban benar:</b> '+x.answer+'. '+esc(x.opts[x.answer])+'</p>').join(''):'<p style="padding:12px;border-radius:10px;background:#e8f5e9"><b>Semua jawaban benar.</b></p>';window.scrollTo(0,0);let status=document.createElement('p');status.className='muted';status.textContent='Menyimpan hasil...';document.getElementById('result').appendChild(status);try{await fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nama:name.value.trim(),nis:nis.value.trim(),kelas:kelas.value.trim(),benar:c,salah:20-c,nilai})});status.textContent='Hasil ujian telah tersimpan.';}catch(e){status.textContent='Nilai tampil, tetapi penyimpanan hasil gagal. Hubungi guru.'}}
</script></body></html>
